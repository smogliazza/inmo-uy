name: CI

on:
  # Every PR, whatever its base: stacked PRs (one phase on top of another) need CI too.
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-and-smoke:
    name: Backend Typecheck, Migrations & Smoke Tests (modules ${{ matrix.modules }})
    runs-on: ubuntu-latest
    # The smoke suite runs with every module on and with every optional module off (spec, section 5.3).
    strategy:
      fail-fast: false
      matrix:
        modules: [all-on, optional-off]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: crm_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/crm_ci_test?schema=public
      JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long-for-hs256
      PORT: 4000
      NODE_ENV: development
      DISABLE_JOBS: "true"
      PLATFORM_DOMAIN: plataforma.test
      SMOKE_MODULES: ${{ matrix.modules }}
      MODULES_ALL: publicSite,publicMap,crmLeads,leadRouting,tasks,appointments,documents,rentals,deals,commissions,marketing,referrals,gifts,aiAssistant,billing,googleOAuth,migrator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend TypeScript typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Module resolution unit tests
        working-directory: backend
        run: npm run test:unit

      - name: Compile backend (production build)
        working-directory: backend
        run: npm run compile

      - name: Apply database migrations (compiled release script)
        working-directory: backend
        run: npm run release:compiled

      - name: Start compiled API server & run smoke tests
        working-directory: backend
        run: |
          if [ "$SMOKE_MODULES" = "all-on" ]; then
            export MODULES_DEFAULT_ON="$MODULES_ALL" AI_ASSISTANT_ENABLED=true
          else
            export MODULES_DEFAULT_OFF="$MODULES_ALL"
          fi
          npm start &
          SERVER_PID=$!
          echo "Waiting for API server on http://localhost:4000/api/health..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health >/dev/null 2>&1; then
              echo "API server is ready."
              break
            fi
            sleep 1
          done
          API_URL=http://localhost:4000 npm run test:smoke
          kill $SERVER_PID || true

  frontend:
    name: Frontend Typecheck, i18n Audit & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend TypeScript typecheck
        working-directory: frontend
        run: npx tsc --noEmit -p .

      - name: Frontend ESLint check (zero errors)
        working-directory: frontend
        run: npx eslint . --quiet

      - name: Frontend production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
        run: npm run build

  docker-images:
    name: Docker images build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: backend
          - image: web
            context: frontend
          - image: backup
            context: deploy/backup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (not pushed; the Release workflow publishes on tags)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://app.plataforma.test
